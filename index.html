<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FedEx - Catalogue</title>

  <!-- Liens vers les icônes de FontAwesome (pour les icônes sociales, etc.) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #101010;
      color: #f1f1f1;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #0f0f0f;
      padding: 15px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      color: #ff8000;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
      background-color: #1c1c1c;
      border-radius: 10px;
    }

    .catalogue {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product {
      background-color: #292929;
      padding: 20px;
      border-radius: 5px;
      text-align: center;
    }

    .product img {
      width: 100%;
      height: auto;
      border-radius: 5px;
    }

    .product h3 {
      color: #ff8000;
    }

    .product p {
      color: #ddd;
    }

    button {
      background-color: #ff8000;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 5px;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #e07b00;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #0f0f0f;
      color: #888;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>FedEx RP - Catalogue</h1>
    <p>Bienvenue dans le catalogue de produits FedEx RP</p>
    <!-- Boutons de connexion/inscription (optionnel pour la page de connexion) -->
    <button onclick="showLoginForm()">Connexion</button>
    <button onclick="showRegisterForm()">Inscription</button>
    <p id="errorMessage" style="color: red; display: none;">Erreur lors de la connexion, vérifie tes informations.</p>
  </header>

  <div class="container">
    <h2>Nos Produits</h2>

    <div class="catalogue" id="productCatalog">
      <!-- Exemple de produit statique -->
      <div class="product">
        <img src="https://via.placeholder.com/300" alt="Produit 1">
        <h3>boite</h3>
        <p>Haute qualité pour un usage RP</p>
        <button>Ajouter au panier</button>
      </div>

      <div class="product">
        <img src="https://via.placeholder.com/300" alt="Produit 2">
        <h3>Cartouches</h3>
        <p>Livraison rapide et fiable</p>
        <button>Ajouter au panier</button>
      </div>

      <!-- Plus de produits peuvent être ajoutés ici -->
    </div>
  </div>

  <footer>
    <p>© 2025 FedEx RP - Tous droits réservés</p>
  </footer>

  <!-- Formulaire de connexion (masqué initialement) -->
  <div id="loginForm" class="hidden">
    <input type="email" id="loginEmail" placeholder="Email" />
    <input type="password" id="loginPassword" placeholder="Mot de passe" />
    <button onclick="login()">Se connecter</button>
  </div>

  <!-- Formulaire d'inscription (masqué initialement) -->
  <div id="registerForm" class="hidden">
    <input type="email" id="registerEmail" placeholder="Email" />
    <input type="password" id="registerPassword" placeholder="Mot de passe" />
    <button onclick="register()">S'inscrire</button>
  </div>

  <!-- Firebase Initialization -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCZP__MEkfijdjW7rf_uau3dFtFL4jjhj0",
      authDomain: "fedex-logistics-8f671.firebaseapp.com",
      projectId: "fedex-logistics-8f671",
      storageBucket: "fedex-logistics-8f671.firebasestorage.app",
      messagingSenderId: "116664376043",
      appId: "1:116664376043:web:8d04276a22e9538c187cae"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Fonction de connexion utilisateur
    function login() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        document.getElementById('errorMessage').innerText = "Veuillez remplir tous les champs!";
        document.getElementById('errorMessage').style.display = 'block';
        return;
      }

      auth.signInWithEmailAndPassword(email, password)
        .then(userCredential => {
          console.log('Utilisateur connecté:', userCredential.user);
          alert('Bienvenue!');
          document.getElementById('errorMessage').style.display = 'none';
        })
        .catch(error => {
          console.error('Erreur de connexion:', error);
          document.getElementById('errorMessage').innerText = "Erreur de connexion! Vérifie tes informations.";
          document.getElementById('errorMessage').style.display = 'block';
        });
    }

    // Fonction d'inscription utilisateur
    function register() {
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;

      if (!email || !password) {
        document.getElementById('errorMessage').innerText = "Veuillez remplir tous les champs!";
        document.getElementById('errorMessage').style.display = 'block';
        return;
      }

      auth.createUserWithEmailAndPassword(email, password)
        .then(userCredential => {
          console.log('Utilisateur inscrit:', userCredential.user);
          alert('Inscription réussie!');
          document.getElementById('errorMessage').style.display = 'none';
        })
        .catch(error => {
          console.error('Erreur d\'inscription:', error);
          document.getElementById('errorMessage').innerText = "Erreur d'inscription! Essaie avec un autre email.";
          document.getElementById('errorMessage').style.display = 'block';
        });
    }

    // Afficher les formulaires de connexion et d'inscription
    function showLoginForm() {
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('errorMessage').style.display = 'none';
    }

    function showRegisterForm() {
      document.getElementById('registerForm').classList.remove('hidden');
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('errorMessage').style.display = 'none';
    }

    // Fonction pour charger les produits depuis Firestore (si tu veux gérer dynamiquement)
    function loadProducts() {
      db.collection("products").get().then(querySnapshot => {
        querySnapshot.forEach(doc => {
          const product = doc.data();
          const productElement = `
            <div class="product">
              <img src="${product.image}" alt="${product.name}">
              <h3>${product.name}</h3>
              <p>${product.description}</p>
              <button>Ajouter au panier</button>
            </div>
          `;
          document.getElementById('productCatalog').innerHTML += productElement;
        });
      });
    }

    // Appel de la fonction pour charger les produits
    loadProducts();
  </script>

</body>
</html>
