<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FedEx RP - Connexion</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>

  <script>
    // Ton vrai bloc Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCZP__MEkfijdjW7rf_uau3dFtFL4jjhj0",
      authDomain: "fedex-logistics-8f671.firebaseapp.com",
      projectId: "fedex-logistics-8f671",
      storageBucket: "fedex-logistics-8f671.firebasestorage.app",
      messagingSenderId: "116664376043",
      appId: "1:116664376043:web:8d04276a22e9538c187cae"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
  </script>

  <style>
    body { font-family: sans-serif; text-align: center; padding: 30px; }
    input, button { margin: 5px; padding: 10px; width: 80%; }
    .container { max-width: 400px; margin: auto; border: 1px solid #ccc; padding: 20px; border-radius: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Connexion / Inscription</h1>
    <h2>Créer un compte</h2>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Mot de passe" />
    <button onclick="register()">S'inscrire</button>

    <h2>Connexion</h2>
    <input type="email" id="loginEmail" placeholder="Email" />
    <input type="password" id="loginPassword" placeholder="Mot de passe" />
    <button onclick="login()">Se connecter</button>

    <p id="userInfo">Non connecté</p>
    <button onclick="logout()">Déconnexion</button>
  </div>

  <script>
    function register() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      auth.createUserWithEmailAndPassword(email, password)
        .then(() => alert("Compte créé"))
        .catch(error => alert("Erreur : " + error.message));
    }

    function login() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      auth.signInWithEmailAndPassword(email, password)
        .then(user => {
          document.getElementById("userInfo").innerText = "Connecté : " + user.user.email;
        })
        .catch(error => alert("Erreur : " + error.message));
    }

    function logout() {
      auth.signOut().then(() => {
        document.getElementById("userInfo").innerText = "Déconnecté";
      });
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById("userInfo").innerText = "Connecté : " + user.email;
      } else {
        document.getElementById("userInfo").innerText = "Non connecté";
      }
    });
  </script>

</body>
</html>
